global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'anggota-service'
    static_configs:
      - targets: ['anggota-service:8081']
    metrics_path: '/actuator/prometheus'

  - job_name: 'buku-service'
    static_configs:
      - targets: ['buku-service:8082']
    metrics_path: '/actuator/prometheus'

  - job_name: 'peminjaman-command-service'
    static_configs:
      - targets: ['peminjaman-command-service:8087']
    metrics_path: '/actuator/prometheus'

  - job_name: 'peminjaman-query-service'
    static_configs:
      - targets: ['peminjaman-query-service:8088']
    metrics_path: '/actuator/prometheus'

  - job_name: 'pengembalian-service'
    static_configs:
      - targets: ['pengembalian-service:8084']
    metrics_path: '/actuator/prometheus'

  - job_name: 'rabbitmq-peminjaman-service'
    static_configs:
      - targets: ['rabbitmq-peminjaman-service:8085']
    metrics_path: '/actuator/prometheus'

  - job_name: 'rabbitmq-pengembalian-service'
    static_configs:
      - targets: ['rabbitmq-pengembalian-service:8086']
    metrics_path: '/actuator/prometheus'

  - job_name: 'api-gateway-pustaka'
    static_configs:
      - targets: ['api-gateway-pustaka:9000']
    metrics_path: '/actuator/prometheus'

  - job_name: 'eureka-server'
    static_configs:
      - targets: ['server-eureka:8761']
    metrics_path: '/actuator/prometheus'